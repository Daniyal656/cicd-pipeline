name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t daniyal656/cicd-pipeline:latest .

      - name: Push to Docker Hub
        run: docker push daniyal656/cicd-pipeline:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull daniyal656/cicd-pipeline:latest
            docker stop webapp || true
            docker rm webapp || true
            docker run -d -p 80:80 --name webapp daniyal656/cicd-pipeline:latest
